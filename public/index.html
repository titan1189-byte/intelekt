<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Облік майна</title>
  <meta name="theme-color" content="#090e14">
  <meta name="application-name" content="Інтелект Облік">
  <meta name="apple-mobile-web-app-title" content="Інтелект Облік">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css?v=20260714-report-period">
</head>
<body>
  <div class="brand-bar" aria-label="Корпорація Інтелект">
    <div class="brand-mark">
      <span class="brand-word">Корпорація</span>
      <span class="brand-pill">Інтелект</span>
    </div>
  </div>

  <main class="app-shell">
    <header class="app-header">
      <div>
        <p class="eyebrow">Google Sheets</p>
        <h1>Облік майна</h1>
      </div>
      <div class="header-actions">
        <label class="search-box">
          <span class="sr-only">Пошук</span>
          <input id="search-input" type="search" placeholder="Пошук: назва, заводський номер, примітка">
        </label>
        <button id="refresh-button" class="icon-button" type="button" title="Оновити" aria-label="Оновити">
          <span aria-hidden="true">↻</span>
        </button>
        <button id="report-button" class="action-button" type="button" title="Надіслати звіт у WhatsApp">
          WhatsApp
        </button>
      </div>
    </header>

    <section class="sync-panel">
      <div>
        <strong id="sheet-title">Підключення...</strong>
        <span id="sync-status">Очікуємо відповідь таблиці</span>
      </div>
      <a id="auth-link" class="auth-link" href="/auth/google" hidden>Увійти через Google</a>
    </section>

    <section id="access-panel" class="access-panel" hidden></section>

    <nav id="sheet-tabs" class="sheet-tabs" aria-label="Аркуші таблиці"></nav>
    <nav id="status-tabs" class="status-tabs" aria-label="Статуси майна"></nav>
    <section class="inventory-shell">
      <header class="inventory-head">
        <div>
          <h2>Позиції</h2>
          <p id="result-count">0 записів</p>
        </div>
      </header>
      <div id="items-body" class="inventory-board"></div>
      <div id="empty-state" class="empty-state" hidden>За поточним фільтром записів немає.</div>
    </section>
  </main>

  <div id="report-dialog" class="modal-backdrop" hidden>
    <form id="report-form" class="report-dialog" autocomplete="off">
      <div class="report-dialog-head">
        <div>
          <span>WhatsApp звіт</span>
          <h2>Період звіту</h2>
        </div>
        <button id="report-cancel-top" class="dialog-close" type="button" aria-label="Закрити">×</button>
      </div>
      <label class="report-period-field">
        <span>Вкажіть час, який буде в звіті</span>
        <input id="report-period-input" type="text" inputmode="text" placeholder="16:00-09:00" required>
      </label>
      <div class="report-dialog-actions">
        <button id="report-cancel" class="secondary-button" type="button">Скасувати</button>
        <button class="primary-button" type="submit">Відправити</button>
      </div>
    </form>
  </div>

  <footer class="app-footer">
    <p>© 2025 Корпорація Інтелект. Всі права захищені.</p>
    <p>З питань звертайтеся: <a href="mailto:intellect@example.com">intellect@example.com</a></p>
  </footer>

  <script src="/script.js?v=20260714-report-period"></script>
</body>
</html>
